name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-hst-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # This package has never been linted, so enabling a full rule set would report
      # thousands of findings across 84 modules and gate every pull request on a cleanup
      # that has not happened yet. The steps below are staged in deliberately: turn each
      # one on once its findings have been worked through. [tool.ruff] in pyproject.toml
      # already describes the house style for anyone running these by hand.
      #
      # TODO Enable once `ruff check src tests` is clean.
      # - name: Ruff
      #   run: |
      #     ruff check src tests
      #
      # TODO Enable once continuation-line indentation is consistent.
      # - name: Flake8 continuation-line indent
      #   run: |
      #     flake8 --select=E12,E13 src tests
      #
      # Enabled: the docs build is clean today, so -W keeps it that way. docs/conf.py
      # leaves nitpicky mode off, because the API carries no Sphinx-level documentation
      # yet; turn it on there once the docstrings are converted.
      - name: Sphinx
        run: |
          sphinx-build -W -b html docs docs/_build

      # Packaging metadata is new here, so this one runs from the start: it is the check
      # that catches a malformed pyproject.toml before a release tries to publish.
      - name: Pyroma
        run: |
          pyroma .

      - name: PyMarkdown
        run: |
          pymarkdown scan README.md CONTRIBUTING.md CLAUDE.md

  test:
    name: Test rms-hst-pipeline
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # hst_helper and queue_manager.config read these at import time with no default, so
      # collection fails outright if they are unset. They point at scratch directories
      # because the deselected tests are the only ones that write real pipeline output.
      - name: Create pipeline directories
        run: |
          mkdir -p "${RUNNER_TEMP}/staging" "${RUNNER_TEMP}/pipeline" "${RUNNER_TEMP}/bundles"
          echo "HST_STAGING=${RUNNER_TEMP}/staging"   >> "$GITHUB_ENV"
          echo "HST_PIPELINE=${RUNNER_TEMP}/pipeline" >> "$GITHUB_ENV"
          echo "HST_BUNDLES=${RUNNER_TEMP}/bundles"   >> "$GITHUB_ENV"

      # The `network` tests query MAST live: they download real products, assert result
      # counts that drift as the archive grows, and delete program directories. They are
      # deselected here and run by network-tests.yml on a schedule instead. The
      # `targets_data` tests need rms-hst-targets' committed caches, which a pip-installed
      # copy of that package does not carry.
      - name: Test with coverage
        run: |
          python -m pytest -m "not network and not targets_data" --cov=src --cov-report=xml tests

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
